<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Social Links — Aditya Admin
    </title>

    <link
        rel="stylesheet"
        href="admin.css">

</head>


<body>

<main class="admin-editor">


    <header class="editor-header">

        <div>

            <p class="dashboard-label">
                PORTFOLIO ADMIN
            </p>

            <h1>
                Social Links
            </h1>

            <p class="editor-subtitle">
                Manage all your contact and social media links.
            </p>

        </div>


        <div class="editor-header-actions">

            <a
                href="../index.html"
                target="_blank"
                class="editor-view">

                View Portfolio ↗

            </a>


            <a
                href="dashboard.html"
                class="editor-back">

                ← Dashboard

            </a>

        </div>

    </header>



    <form
        id="socialForm"
        class="editor-form">


        <div class="editor-section-title">

            <span>
                01
            </span>

            <div>

                <h2>
                    Social Media
                </h2>

                <p>
                    Add your profile URLs.
                </p>

            </div>

        </div>


        <div class="editor-field">

            <label>
                Instagram
            </label>

            <input
                type="url"
                id="instagram"
                placeholder="https://instagram.com/...">

        </div>


        <div class="editor-field">

            <label>
                LinkedIn
            </label>

            <input
                type="url"
                id="linkedin"
                placeholder="https://linkedin.com/in/...">

        </div>


        <div class="editor-field">

            <label>
                GitHub
            </label>

            <input
                type="url"
                id="github"
                placeholder="https://github.com/...">

        </div>


        <div class="editor-field">

            <label>
                WhatsApp
            </label>

            <input
                type="url"
                id="whatsapp"
                placeholder="https://wa.me/91...">

        </div>


        <div class="editor-field">

            <label>
                Facebook
            </label>

            <input
                type="url"
                id="facebook"
                placeholder="https://facebook.com/...">

        </div>


        <div class="editor-field">

            <label>
                X / Twitter
            </label>

            <input
                type="url"
                id="x"
                placeholder="https://x.com/...">

        </div>


        <div class="editor-two-column">


            <div class="editor-field">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com">

            </div>


            <div class="editor-field">

                <label>
                    Phone
                </label>

                <input
                    type="text"
                    id="phone"
                    placeholder="+91 ...">

            </div>

        </div>


        <div
            id="socialMessage"
            class="save-message">

        </div>


        <button
            type="submit"
            id="saveSocial"
            class="save-button">

            <span>
                Save Social Links
            </span>

            <b>
                ✓
            </b>

        </button>


    </form>


</main>


<script src="social.js"></script>

</body>

</html>
